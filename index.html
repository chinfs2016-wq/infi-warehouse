<html lang="zh">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Infinity 司机排程</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1f2a1f;--mut:#6b776b;--green:#2e7d32;--gl:#e6f4e7;--red:#c62828;--rl:#fdeaea;--org:#e65100;--ol:#fff1e0;--line:#dde3dc}
@media(prefers-color-scheme:dark){:root{--bg:#121512;--card:#1c211c;--ink:#e8efe8;--mut:#93a093;--gl:#17301a;--rl:#3a1a1a;--ol:#3a2810;--line:#2e362e;--green:#66bb6a;--red:#ef5350;--org:#ffa726}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Microsoft YaHei",sans-serif}
header{position:sticky;top:0;background:#2e7d32;color:#fff;padding:10px 16px;z-index:5}
header h1{margin:0;font-size:17px}
.who{font-size:13px;opacity:.9}
nav{display:flex;gap:6px;margin-top:8px}
nav button{flex:1;padding:8px 4px;border:0;border-radius:8px;background:rgba(255,255,255,.2);color:#fff;font-size:14px}
nav button.on{background:#fff;color:#2e7d32;font-weight:700}
main{padding:12px 16px 80px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:600}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.4}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.ok{background:var(--gl);color:var(--green)}.bad{background:var(--rl);color:var(--red)}.warn{background:var(--ol);color:var(--org)}.gray{background:var(--bg);color:var(--mut)}
h2{font-size:16px;margin:18px 0 4px}
.mut{color:var(--mut);font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:24px;height:24px;flex:none}
.item .nm{flex:1}
.done{opacity:.55}
a{color:var(--green)}
.hide{display:none}
.login{max-width:380px;margin:8vh auto 0}
.login h1{text-align:center;font-size:22px;margin:0 0 4px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.note{color:var(--green);font-size:14px;margin-top:8px}
#scanm{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--card);width:100%;max-width:720px;padding:12px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
.sbox video{width:100%;max-height:38vh;background:#000;border-radius:10px;margin:8px 0;object-fit:cover}
#sbox_v{position:relative}
.aim{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
#smsg{min-height:44px;margin:6px 0;font-size:15px}
#dlgm{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.dlgbox{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.dlgtext{font-size:16px;line-height:1.5}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:var(--red);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;text-align:center}
</style>
</head>

function uiDialog({text,input=false,okText,showCancel=true}){
  return new Promise(res=>{
    const m=document.createElement('div');m.id='dlgm';
    m.innerHTML=`<div class="dlgbox"><div class="dlgtext">${esc(T(text)).replace(/\n/g,'<br>')}</div>${input?'<input id="dlg_in" autocomplete="off" inputmode="numeric" style="margin-top:10px">':''}<div class="row" style="margin-top:14px;justify-content:flex-end">${showCancel?'<button class="btn sec" id="dlg_no">取消</button>':''}<button class="btn" id="dlg_ok">${okText||'确定'}</button></div></div>`;
    document.body.appendChild(m);
    const done=v=>{m.remove();res(v)};
    m.querySelector('#dlg_ok').onclick=()=>done(input?m.querySelector('#dlg_in').value:true);
    if(showCancel)m.querySelector('#dlg_no').onclick=()=>done(input?null:false);
    if(input){const i=m.querySelector('#dlg_in');i.focus();i.onkeydown=e=>{if(e.key==='Enter')m.querySelector('#dlg_ok').click()}}
  });
}

async function syncOnce(){
  if(!sb||!me)return;
  for(const[n,c]of Object.entries(COLS)){
    const cur=new Map(c.rows().map(r=>[r[c.pk],r]));
    const sn=snap[n];
    const ins=[];
    for(const[k,r]of cur){
      const str=JSON.stringify(r);
      if(sn.get(k)===str)continue;
      const row={...r,updated_at:new Date().toISOString()};if(n==='settings')delete row.updated_at;
      if(n!=='settings'&&!sn.has(k)){ins.push([k,str,row]);continue}
      const q=n==='settings'?sb.from(c.table).upsert(row):sb.from(c.table).update(row).eq(c.pk,k);
      const{error}=await q;if(error)throw error;
      sn.set(k,str);
    }
    for(let i=0;i<ins.length;i+=200){
      const part=ins.slice(i,i+200);
      const{error}=await sb.from(c.table).insert(part.map(x=>x[2]));if(error)throw error;
      part.forEach(x=>sn.set(x[0],x[1]));
    }
    for(const k of[...sn.keys()]){
      if(cur.has(k))continue;
      const{error}=await sb.from(c.table).delete().eq(c.pk,k);if(error)throw error;
      sn.delete(k);
    }
  }
}

const norm=x=>String(x).toLowerCase().replace(/farm fresh/g,'').replace(/\s+/g,' ').trim();
const findProduct=n=>S.products.find(p=>norm(p.name)===norm(n));
const prodById=i=>S.products.find(p=>p.id===i);
const pidOf=i=>(i.pid&&prodById(i.pid)?i.pid:findProduct(i.name)?.id)||'';
const ik=i=>pidOf(i)||key(i.name);
const parseItems=t=>t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  const m=l.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*(\S*)$/);
  const it=m?{name:m[1].trim(),qty:+m[2],unit:m[3]||''}:{name:l,qty:1,unit:''};
  it.pid=findProduct(it.name)?.id||'';return it});
const itemsText=a=>a.map(i=>`${i.name} ${i.qty} ${i.unit}`.trim()).join('\n');
function buildAgg(stops){
  const agg={};
  stops.forEach(s=>s.items.forEach(i=>{const k=ik(i);(agg[k]??={name:prodById(pidOf(i))?.name||i.name,unit:i.unit,qty:0,stops:[],pid:pidOf(i)});agg[k].qty+=toPcs(i);agg[k].stops.push(s)}));
  return agg}
const daysLeft=(exp,on)=>Math.round((new Date(exp)-new Date(on))/864e5);
const dayStops=(d,drv)=>S.stops.filter(s=>s.date===d&&(!drv||s.driver===drv)).sort((a,b)=>a.seq-b.seq);
const loadKey=(d,drv)=>d+'|'+drv;
/* 库存统一用「件」记账；箱 = 每箱几件 */
const perCtn=pid=>prodById(pid)?.perCtn||1;
const isCtnUnit=u=>!u||/^(ctn|ctns|carton|cartons|box|boxes|箱)$/i.test(String(u).trim());
const toPcs=i=>i.qty*(isCtnUnit(i.unit)?perCtn(pidOf(i)):1);
const fmtQty=(pid,pcs)=>{const c=perCtn(pid);if(c<=1)return pcs+' 件';const k=Math.floor(pcs/c),r=pcs-k*c;return(k?k+' ctn':'')+(k&&r?' + ':'')+(r||!k?r+' 件':'')};
const dig=x=>String(x||'').replace(/\D/g,'');
const codeEq=(sc,st)=>{sc=dig(sc);st=dig(st);if(!sc||!st)return false;if(sc===st)return true;
  if(sc.length===14&&st.length===13)return sc.slice(1,13)===st.slice(0,12);
  if(sc.length===13&&st.length===14)return st.slice(1,13)===sc.slice(0,12);return false};
const hasCode=(list,c)=>(list||[]).some(x=>codeEq(c,x));
const newLine=()=>({pid:'',ctn:'',pcs:'',exp:'',loc:'',src:''});
const modeTxt=m=>m.entry_mode==='manual'?' (手动选)':m.entry_mode==='scan'?' (扫码)':'';
const itemExp=(L,s,j,x)=>{const al=(L.alloc||[]).filter(a=>a.stop===s.id&&a.item===j);return al.length?al.map(a=>a.exp).sort()[0]:L.batch[ik(x)]?.exp};
// 先到期先出 (FEFO)，并满足每位客人要求的最少剩余天数
function allocate(stops){
  const rem={};S.batches.forEach(b=>rem[b.id]=b.qty);
  const out=[],short=[];
  stops.forEach(s=>s.items.forEach((it,j)=>{
    const pid=pidOf(it);if(!pid)return;
    let need=toPcs(it);
    const min=prodById(pid)?.minDays??S.minDays[s.type]??1;
    const el=S.batches.filter(b=>b.product_id===pid&&!b.closed&&daysLeft(b.expiry,s.date)>=min).sort((a,b)=>a.expiry<b.expiry?-1:1);
    for(const b of el){if(need<=0)break;const t=Math.min(need,rem[b.id]);if(t<=0)continue;out.push({stop:s.id,item:j,batch:b.id,pid,pcs:t,exp:b.expiry});rem[b.id]-=t;need-=t}
    if(need>0)short.push({stop:s.id,item:j,pid,pcs:need,name:it.name,customer:s.customer,min});
  }));
  return{out,short};
}

  if(!exp)return{st:'none'};

  const stops=dayStops(ui.date,drv);
  if(!stops.length)return head+'<p class="mut">今天没有排单 👍</p>';
  const L=(S.loads[loadKey(ui.date,drv)]??={confirmed:false,batch:{}});
  const agg=buildAgg(stops);
  const sm=S.stockMode;
  const al=sm?(L.confirmed?{out:L.alloc||[],short:L.short||[]}:allocate(stops)):{out:[],short:[]};
  const managed=a=>sm&&a.pid;
  const qtyTxt=a=>a.pid?fmtQty(a.pid,a.qty):a.qty+esc(a.unit);
  const rows=Object.entries(agg).map(([k,a])=>{
    const b=L.batch[k]??={};
    if(managed(a)){
      const sh=al.short.filter(x=>x.pid===a.pid).reduce((n,x)=>n+x.pcs,0);
      const byB={};al.out.filter(x=>x.pid===a.pid).forEach(x=>{(byB[x.batch]??={exp:x.exp,pcs:0}).pcs+=x.pcs});
      const lines=Object.values(byB).sort((p,q)=>p.exp<q.exp?-1:1).map(x=>`<div class="mut">📦 拿到期日 <b>${x.exp}</b> (剩 ${daysLeft(x.exp,ui.date)} 天) 的货：<b>${fmtQty(a.pid,x.pcs)}</b></div>`).join('');
      return `<div class="item" style="align-items:flex-start"><input type="checkbox" ${b.loaded?'checked':''} data-act="loaded" data-v="${k}" ${L.confirmed?'disabled':''}>
       <div class="nm"><b>${esc(a.name)}</b> 需要 ${qtyTxt(a)} <span class="mut">已扫 ${fmtQty(a.pid,b.scanned||0)}/${fmtQty(a.pid,a.qty)}</span>
        ${lines}${sh?`<div style="color:var(--red)">✖ 缺 ${fmtQty(a.pid,sh)}：仓库没有足够寿命期的货</div>`:''}</div></div>`;
    }
    const res=a.stops.map(s=>({s,...check(b.exp,s,a.pid)}));
    const bad=res.filter(r=>r.st==='bad');
    let tag='<span class="badge gray">输入寿命期</span>';
    if(b.exp){
      const dl=daysLeft(b.exp,ui.date);
      if(!bad.length)tag=`<span class="badge ok">✔ 剩 ${dl} 天</span>`;
      else if(bad.length===res.length)tag=`<span class="badge bad">✖ 剩 ${dl} 天 · 不合格</span>`;
      else tag=`<span class="badge warn">⚠ 剩 ${dl} 天 · 部分客人不合格</span>`;
    }
    return `<div class="item" style="align-items:flex-start"><input type="checkbox" ${b.loaded?'checked':''} data-act="loaded" data-v="${k}" ${L.confirmed?'disabled':''}>
     <div class="nm"><b>${esc(a.name)}</b> × ${qtyTxt(a)} <span class="mut">已扫 ${a.pid?fmtQty(a.pid,b.scanned||0):(b.scanned||0)}/${qtyTxt(a)}</span> ${tag}
      <div class="row" style="margin-top:4px"><span class="mut">最佳食用/到期日:</span><input type="date" style="width:auto" value="${b.exp||''}" data-act="exp" data-v="${k}" ${L.confirmed?'disabled':''}></div>
      ${bad.map(r=>`<div class="mut" style="color:var(--red)">✖ ${esc(r.s.customer)} 要求至少剩 ${r.need} 天 (此批剩 ${r.dl} 天)</div>`).join('')}
     </div></div>`}).join('');
  const allOk=Object.entries(agg).every(([k,a])=>{const b=L.batch[k]||{};if(managed(a))return b.loaded;return b.exp&&b.loaded&&!a.stops.some(s=>check(b.exp,s,a.pid).st==='bad')});
  const anyBad=Object.entries(agg).some(([k,a])=>!managed(a)&&L.batch[k]?.exp&&a.stops.some(s=>check(L.batch[k].exp,s,a.pid).st==='bad'));
  const hasShort=sm&&al.short.length>0;
  const done=stops.filter(s=>s.status&&s.status!=='pending').length;
  return head+`
  <h2>① 仓库装货 ${L.confirmed?'<span class="badge ok">已确认</span>':''}</h2>
  <div class="card">
   <div class="mut">${sm?'照下面「拿哪一批」去拿货 → 扫条码 → 打勾。确认出发后，系统自动扣库存。':'逐样拿货 → 扫条码 → 看清楚日期 → 输入到期日。红色 = 寿命期不够，不要装，通知仓库换货。'}</div>
   ${L.confirmed?'':'<button class="btn" style="width:100%;margin:8px 0" data-act="scanLoad">📷 扫描装货</button>'}
   ${rows}
   ${L.confirmed?`<button class="btn sec" style="margin-top:10px" data-act="unconfirm">重新修改装货</button>`:
   `${hasShort?'<div class="badge bad" style="margin-top:10px">⚠ 有货缺 / 寿命期不够，请通知仓库或负责人</div>':''}
    <button class="btn" style="margin-top:10px;width:100%" data-act="confirmLoad" ${allOk?'':'disabled'}>✅ 全部装好，出发</button>
    ${anyBad||hasShort?'<button class="btn red" style="margin-top:8px;width:100%" data-act="alertWh">📲 通知仓库 (WhatsApp)</button>':''}`}
  </div>
  <h2>② 送货 <span class="mut">${done}/${stops.length} 站完成</span></h2>
  ${L.confirmed?stops.map((s,i)=>stopCard(s,i,L)).join(''):'<p class="mut">先完成装货确认才能开始送货。</p>'}`;
}

  const open=ui.open===s.id;
  const fin=s.status==='delivered'||s.status==='failed';
  const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address||s.customer);
  return `<div class="card ${fin?'done':''}">
   <div class="row" data-act="open" data-v="${s.id}"><b class="grow">${i+1}. ${esc(s.customer)}</b>${badge(s)}</div>
   <div class="mut">${s.po?'PO '+esc(s.po)+' · ':''}${esc(s.address)}</div>
   ${open?`
   <div class="row" style="margin:8px 0">
     <a class="btn sec sm" target="_blank" href="${maps}">🗺 导航</a>
     ${s.phone?`<a class="btn sec sm" target="_blank" href="https://wa.me/${esc(s.phone.replace(/\D/g,''))}">💬 WhatsApp</a><a class="btn sec sm" href="tel:${esc(s.phone)}">📞 打电话</a>`:''}
   </div>
   ${s.note?`<div class="mut">📝 ${esc(s.note)}</div>`:''}
   ${s.items.map((x,j)=>{
     const pid=pidOf(x),c=check(itemExp(L,s,j,x),s,pid);
     const tag=c.st==='ok'?`<span class="badge ok">剩 ${c.dl} 天</span>`:c.st==='bad'?`<span class="badge bad">剩 ${c.dl} 天 · 要求≥${c.need}</span>`:'<span class="badge gray">没日期</span>';
     return `<div class="item"><input type="checkbox" ${x.unloaded?'checked':''} ${fin?'disabled':''} data-act="unload" data-v="${s.id}" data-j="${j}"><div class="nm">${esc(x.name)} <b>${x.qty}${esc(x.unit)}</b> <span class="mut">扫 ${fmtQty(pid,x.scanned||0)}/${fmtQty(pid,toPcs(x))}</span> ${tag}</div></div>`}).join('')}
   ${fin?'':`<button class="btn sec" style="width:100%" data-act="scanUnload" data-v="${s.id}">📷 扫描卸货</button>
   <label>收货人 / 备注</label><input id="rc_${s.id}" placeholder="例如 Siti 收货 / 少收 1kg">
   <div class="row" style="margin-top:10px">
     <button class="btn grow" data-act="deliver" data-v="${s.id}">✅ 已送达</button>
     <button class="btn red" data-act="fail" data-v="${s.id}">✖ 送不到</button>
   </div>`}`:''}
  </div>`;
}

const BACKUP_TABLES=[['products','id'],['groups','created_at'],['profiles','created_at'],['settings','key'],['batches','created_at'],['stock_moves','created_at'],['stops','id'],['loads','key'],['stock_cleanup_log','at']];
async function fetchAllRows(table,col){
  let all=[];
  for(let i=0;i<50;i++){
    const{data,error}=await sb.from(table).select('*').order(col,{ascending:true}).range(i*1000,i*1000+999);
    if(error)throw new Error(table+': '+error.message);
    all=all.concat(data);if(data.length<1000)break;
  }
  return all;
}
async function collectBackup(){
  const tables={};
  for(const[t,c]of BACKUP_TABLES)tables[t]=await fetchAllRows(t,c);
  const counts={};for(const t in tables)counts[t]=tables[t].length;
  return{app:'infi-warehouse',version:VERSION,exported_at:new Date().toISOString(),exported_by:me?.name||'',counts,tables};
}
function saveFile(name,blob){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},3000);
}
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())};
async function doBackupJson(prefix='infi-backup'){
  const b=await collectBackup();
  saveFile(prefix+'-'+stamp()+'.json',new Blob([JSON.stringify(b)],{type:'application/json'}));
  ST.set('infiLastBackup',new Date().toISOString());
  return b;
}
function backupWorkbook(b){
  const T=b.tables,pn=id=>T.products.find(p=>p.id===id)?.data?.name||id,gn=id=>T.groups.find(g=>g.id===id)?.name||'';
  const pc=id=>T.products.find(p=>p.id===id)?.data?.perCtn||1;
  const bm=new Map(T.batches.map(x=>[x.id,x]));
  const qty={};T.stock_moves.filter(m=>m.status==='confirmed').forEach(m=>qty[m.batch_id]=(qty[m.batch_id]||0)+m.delta);
  const split=(id,q)=>{const c=pc(id),a=Math.abs(q),k=c>1?Math.floor(a/c):0;return[Math.sign(q||1)*k,Math.sign(q||1)*(c>1?a-k*c:a)]};
  const fdt=t=>t?new Date(t).toLocaleString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const stock=[[tx('产品','Product'),tx('到期日','Expiry date'),tx('箱','Cartons'),tx('散装(件)','Loose pcs'),tx('总件数','Total pcs'),tx('货架位置','Location'),tx('收货日期','Received'),tx('PO / DO','PO / DO'),tx('是否已收起','Closed')]];
  T.batches.forEach(x=>{const q=qty[x.id]||0,[k,r]=split(x.product_id,q);stock.push([pn(x.product_id),x.expiry,k,r,q,x.location||'',x.received_date,x.po_no||'',x.closed?tx('是','Yes'):''])});
  const TYPE={receive:tx('进货','Receive'),load:tx('装车','Loaded on truck'),load_undo:tx('撤销装车','Undo loading'),damage:tx('报损','Write-off'),expired:tx('过期报废','Expired write-off'),adjust:tx('盘点 / 修改','Count / edit'),return:tx('退回','Returned')};
  const ST={pending:tx('待确认','Pending'),confirmed:tx('已确认','Confirmed'),rejected:tx('已退回','Returned')};
  const recs=[[tx('录入时间','Entered at'),tx('产品','Product'),tx('类型','Type'),tx('总件数 (+/-)','Total pcs (+/-)'),tx('到期日','Expiry date'),tx('货架位置','Location'),tx('PO / DO','PO / DO'),tx('状态','Status'),tx('录入人','Entered by'),tx('确认人','Confirmed by'),tx('确认时间','Confirmed at'),tx('分组','Group'),tx('备注','Note')]];
  T.stock_moves.forEach(m=>{const x=bm.get(m.batch_id)||{};recs.push([fdt(m.created_at),pn(m.product_id),TYPE[m.type]||m.type,m.delta,x.expiry||'',x.location||'',m.ref||x.po_no||'',ST[m.status]||m.status,m.by_name||'',m.confirmed_by_name||'',fdt(m.confirmed_at),gn(m.group_id),m.note||''])});
  const users=[[tx('名字','Name'),tx('角色','Role'),tx('登入用的电话 / Email','Login phone / Email'),tx('分组','Group'),tx('状态','Status')]];
  T.profiles.forEach(u=>users.push([u.name,ROLES[u.role]||u.role,u.identifier,gn(u.group_id),u.active?tx('启用','Active'):tx('已停用','Disabled')]));
  const prods=[[tx('产品','Product'),tx('分类','Category'),tx('每箱件数','Pcs per carton'),tx('单件条码','Item barcode'),tx('整箱条码','Carton barcode'),tx('最低库存(件)','Min stock (pcs)'),tx('SQL 代码','SQL code'),tx('SQL 名称','SQL name')]];
  T.products.forEach(r=>{const d=r.data||{};prods.push([d.name,d.cat||'',d.perCtn||'',(d.codes||[]).join(', '),(d.ctnCodes||[]).join(', '),d.minStock||'',d.sqlCode||'',d.sqlName||''])});
  const wb=XLSX.utils.book_new(),add=(rows,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add(stock,tx('库存现况','Current stock'),[50,13,9,11,11,14,13,16,10]);
  add(recs,tx('全部库存记录','All stock records'),[17,48,16,12,12,12,14,11,14,14,17,10,40]);
  add(users,tx('用户','Users'),[20,12,26,10,10]);
  add(prods,tx('产品库','Products'),[50,10,12,26,26,14]);
  return wb;
}

/* ---------- 导出 Excel ---------- */
function computeAlerts(){
  const today=iso(new Date()),live=S.batches.filter(b=>b.qty>0);
  const expired=live.filter(b=>daysLeft(b.expiry,today)<0);
  const soon=live.filter(b=>{const d=daysLeft(b.expiry,today);return d>=0&&d<=S.alertDays});
  const tot={};live.forEach(b=>tot[b.product_id]=(tot[b.product_id]||0)+b.qty);
  const low=S.products.filter(p=>p.minStock>0&&(tot[p.id]||0)<p.minStock);
  return{expired,soon,low,tot,today};
}
const CATSHEET={'UHT':'UHT','鲜奶':'PST','奶粉':'Powder','牛油':'Butter','冰淇淋':'Ice cream','其他':'Others'};
function buildStockSheets(){
  const A=computeAlerts(),today=A.today;
  const live=S.batches.filter(b=>b.qty>0);
  const byP={};live.forEach(b=>(byP[b.product_id]??=[]).push(b));
  const split=(pid,q)=>{const c=perCtn(pid);return c>1?[Math.floor(q/c),q-Math.floor(q/c)*c]:[0,q]};
  const sum=[[tx('产品','Product'),tx('分类','Category'),tx('每箱件数','Pcs per carton'),tx('箱','Cartons'),tx('散装(件)','Loose pcs'),tx('总件数','Total pcs'),tx('最早到期','Earliest expiry'),tx('到期日数量','No. of expiry dates'),tx('货架位置','Location'),tx('状态','Status'),tx('SQL 代码','SQL code'),...OWNERS.map(o=>OWNER_LBL[o]+' ('+tx('件','pcs')+')')]];
  let grand=0;
  S.products.filter(p=>byP[p.id]||A.low.includes(p)).forEach(p=>{
    const l=byP[p.id]||[],tot=l.reduce((n,b)=>n+b.qty,0),[k,r]=split(p.id,tot);grand+=tot;
    const st=[];

/* ---------- ACTUAL BALANCE (照仓库的样表: DOB / IFD / 99 / IFS(STOKIST)) ---------- */
function abWorkbook(){
  const OC=['DOB','IFD','99','IFS'];
  const abDiv=c=>{const r=AB_ROWS.find(x=>x[1]===c);return r&&r[3]?r[3]:0};
  const bcOf={};
  S.products.forEach(p=>{if(p.sqlCode&&((p.codes&&p.codes[0])||(p.ctnCodes&&p.ctnCodes[0]))){const q=S.batches.filter(b=>b.product_id===p.id&&b.qty>0).reduce((n,b)=>n+b.qty,0),cur=bcOf[p.sqlCode];if(!cur||q>cur.q)bcOf[p.sqlCode]={q,i:(p.codes&&p.codes[0])||'',c:(p.ctnCodes&&p.ctnCodes[0])||''}}});
  const sql={};
  S.batches.filter(b=>b.qty!==0).forEach(b=>{const p=prodById(b.product_id);if(!p||!p.sqlCode)return;
    const pc=perCtn(p.id)||0,o=b.owner||'DOB';let code=p.sqlCode,q=b.qty,d;
    if(/^MPG/.test(code)&&!code.includes('(')){ // Grow 粉: DOB 和 99SM 在 SQL 里是不同的行，件数照原样
      code=o==='DOB'?code+'(DOB)':(o==='99'?code+'(99SM)':code);d=abDiv(code)||pc||12}
    else{d=abDiv(code)||pc||12;q=pc?b.qty*d/pc:b.qty}
    const e=sql[code]??={name:p.name,div:d,v:{}};e.v[o]=(e.v[o]||0)+q});
  const rows=AB_ROWS.map(r=>({c:r[0],code:r[1],name:r[2],red:r[4]}));
  Object.keys(sql).forEach(k=>{if(!rows.some(r=>r.code===k))rows.push({c:'',code:k,name:sql[k].name,red:0,extra:1})});
  const cv=(x,d)=>{const sg=x<0?-1:1,a=Math.abs(x),k=Math.floor(a/d+1e-9);return sg*Math.round((k+(a-k*d)/d)*100)/100};
  const bcFor=code=>{const base=code.replace(/\((DOB|99SM)\)(SAMPLE)?$/,'');return bcOf[code]||bcOf[base]||{i:'',c:''}};
  const aoa=[[iso(new Date()),'','','','','TOTAL','ACTUAL BAL','ACTUAL BAL','ACTUAL BAL','ACTUAL BAL',''],
    ['','','','','','ACTUAL BALANCE','DOB','IFD','99','STOKIST (IFS)',''],
    ['ITEM BARCODE (单件)','CARTON BARCODE (整箱)','CODE','SQL ITEM CODE ( NO EDIT NO REMOVE)','PRODUCT NAME','','','','','',tx('备注','Note')]];
  rows.forEach(r=>{const e=sql[r.code],bc=bcFor(r.code);
    const nums=e?OC.map(o=>cv(e.v[o]||0,e.div)):['','','',''],tot=e?cv(OC.reduce((n,o)=>n+(e.v[o]||0),0),e.div):'';
    aoa.push([bc.i||'',bc.c||'',r.c,r.code,r.name,tot,...nums,r.red?tx('红色 = 99 优先','Red = 99 priority'):(r.extra?tx('样表没有这个代码','Not in template'):'')])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  for(let i=3;i<aoa.length;i++)for(let c=5;c<=9;c++){const cell=ws[XLSX.utils.encode_cell({r:i,c})];if(cell&&typeof cell.v==='number')cell.z='0.00'}
  for(let i=3;i<aoa.length;i++)for(let c=0;c<=1;c++){const cell=ws[XLSX.utils.encode_cell({r:i,c})];if(cell&&cell.v!=='')cell.t='s'}
  ws['!cols']=[{wch:16},{wch:16},{wch:18},{wch:30},{wch:44},{wch:12},{wch:10},{wch:10},{wch:10},{wch:12},{wch:18}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ACTUAL BALANCE');
  return{wb,name:'ACTUAL_BALANCE_'+iso(new Date())+'.xlsx'};
}
function stockWorkbook(){
  const{sum,det,today}=buildStockSheets();
  const wb=XLSX.utils.book_new();
  const W=[50,10,12,9,11,11,14,14,16,22,20,11,11,11,11];
  const mk=(rows,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(x=>({wch:x}));return ws};
  const TOT=tx('合计','Total');
  const body=sum.slice(1).filter(r=>r.length&&r[0]!==TOT);
  XLSX.utils.book_append_sheet(wb,mk(sum,W),tx('汇总','Summary'));
  const order=['UHT','PST','Powder','Butter','Ice cream','Others'];
  const cats=[...order,...[...new Set(body.map(r=>r[1]))].filter(c=>!order.includes(c))];

    XLSX.utils.book_append_sheet(wb,mk([sum[0],...rows,[],[TOT,'','','','',tot,'',rows.length,'','']],W),(c||'Others').slice(0,31));
  });
  XLSX.utils.book_append_sheet(wb,mk(det,[50,13,11,9,11,11,14,13,16,12,20,12]),tx('按到期日明细','By expiry date'));
  return{wb,name:'stock-'+today+'.xlsx'};
}

function negCard(){const g={};S.batches.filter(b=>b.qty<0).forEach(b=>{const o=b.owner||'DOB',k=o+'|'+b.product_id,e=g[k]??={o,pid:b.product_id,neg:0,net:0};e.neg+=b.qty});

  ${noCtn?`<div class="mut" style="margin-top:8px">⚠ ${noCtn} 个产品还没设「每箱几件」，请到设置填写，否则箱和件换算不了。</div>`:''}

let scanCtx={};
const prefMem={};
const getPref=()=>{let p={};try{p=JSON.parse(ST.get('infiPref')||'{}')}catch{}return{...p,...prefMem}};
function withProduct(code,fn){
  const cand=[];
  S.products.forEach(p=>{if(hasCode(p.codes,code))cand.push({p,ctn:false});if(hasCode(p.ctnCodes,code))cand.push({p,ctn:true})});
  if(cand.length===1)return fn(cand[0].p,cand[0].ctn);
  if(cand.length>1){
    const pref=getPref();
    const pc=cand.find(c=>pref[dig(code)]===c.p.id+(c.ctn?'|c':'|u'));
    if(pc)return fn(pc.p,pc.ctn);
    scanCtx.pending=fn;scanCtx.code=code;
    return `<div>这个条码对应多个产品，请选 <span class="mut">(选一次，以后自动记住)</span>：</div>`+cand.slice(0,8).map(c=>`<button class="btn sec" style="width:100%;text-align:left;margin-top:4px" data-act="scanChoose" data-v="${c.p.id}" data-k="${c.ctn?'c':'u'}">${esc(c.p.name)} ${c.ctn?'(整箱)':'(单件)'}</button>`).join('')}
  scanCtx.code=code;
  if(!canStock())return `<span class="badge warn">⚠ 这个条码还没登记 (${esc(code)})</span> 请通知负责人，或手动打勾。`;
  return `<div>新条码 <b>${esc(code)}</b>，是哪个产品？</div><div class="row"><input id="sq" class="grow" placeholder="输入产品名搜索" data-act="noop"></div><div id="sres" class="mut">先输入产品名</div>
   <div class="mut" style="margin-top:6px">找到后选「单件」或「整箱」：</div>`}
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('载入失败 '+u));setTimeout(()=>no(new Error('载入超时 '+u)),15000);document.head.appendChild(e)});
const ZX_URL='zxing.min.js'; // 放在自己的网站上，不靠外部下载
let zxMulti=null;
function zxDecode(canvas){
  if(!window.ZXing)return null;
  try{
    if(!zxMulti){
      zxMulti=new ZXing.MultiFormatReader();const h=new Map(),F=ZXing.BarcodeFormat;
      h.set(ZXing.DecodeHintType.TRY_HARDER,true);
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.ITF,F.CODE_39]);
      zxMulti.setHints(h);
    }
    const lum=new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return zxMulti.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum))).getText();
  }catch(e){return null}
}
function zxDecodeRot(canvas){ // 条码横着/竖着拿都能读
  const r=document.createElement('canvas');r.width=canvas.height;r.height=canvas.width;
  const x=r.getContext('2d');x.translate(r.width,0);x.rotate(Math.PI/2);x.drawImage(canvas,0,0);return zxDecode(r)}

   <label class="btn sec" style="display:block;text-align:center;margin:8px 0">📷 拍照识别 (现场扫不出来时用)<input id="sphoto" type="file" accept="image/*" capture="environment" hidden></label>
   <div class="row"><input id="smanual" class="grow" placeholder="或手动输入条码 / 扫描枪" inputmode="numeric"><button class="btn sm" id="sok">确定</button></div></div>`;
  document.body.appendChild(m);
  let stopped=false,stream,reader,det,last='',lastT=0,frames=0;
  const msg=h=>{const e=$('#smsg');if(e)e.innerHTML=h};
  const diag=t=>{const e=$('#sdiag');if(e)e.textContent=t};
  const beep=()=>{try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=1100;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},110)}catch{}};
  const feed=(c,force)=>{c=String(c).trim();if(!c)return;const n=Date.now();
    if(!force&&(scanCtx.hold||n<(scanCtx.cool||0)))return;
    if(!force&&c===last&&n-lastT<2500)return;last=c;lastT=n;
    lastAct=Date.now();const d=$('#sdet');if(d)d.textContent='✓ 读到条码: '+c;
    const vv=$('#sv');if(vv){vv.style.outline='4px solid #2e7d32';setTimeout(()=>{vv.style.outline=''},500)}
    beep();
    try{navigator.vibrate?.(60);scanCtx.feed=x=>feed(x,true);scanCtx.code=c;rev++;msg(onCode(c))}
    catch(e){msg('⚠ 读到条码 '+esc(c)+' 但处理时出错：'+esc(e.message||e));diag('错误: '+String(e.stack||e).slice(0,240))}};
  scanCtx.feed=x=>feed(x,true);
  const close=()=>{stopped=true;try{reader?.reset()}catch{}stream?.getTracks().forEach(t=>t.stop());m.remove();onClose?.()};
  $('#sx').onclick=close;
  $('#sok').onclick=()=>{feed($('#smanual').value,true);$('#smanual').value=''};
  $('#smanual').onkeydown=e=>{if(e.key==='Enter')$('#sok').click()};
  $('#sphoto').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;msg('识别照片中…');
    try{
      let code=null;
      if(det&&window.createImageBitmap){try{const r=await det.detect(await createImageBitmap(f));code=r[0]?.rawValue}catch{}}
      if(!code){
        if(!window.ZXing)await loadScript(ZX_URL);
        const rd=new ZXing.BrowserMultiFormatReader(),url=URL.createObjectURL(f);
        code=(await rd.decodeFromImageUrl(url)).getText();
      }
      feed(code,true);
    }catch(err){msg('⚠ 照片里认不出条码。请靠近一点、让条码占满画面、对焦清楚再拍。')}
    e.target.value='';
  };
  const v=$('#sv');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw Object.assign(new Error('这个浏览器不支持相机。请直接用 Chrome 或 Safari 打开网址 (不要在 WhatsApp / 微信里打开)。'),{name:'NoMediaDevices'});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;await v.play();
    try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch{}
    msg('相机已开。把条码放在画面中间，距离约 10–20 厘米，等它对焦。');
  }catch(e){msg(camErr(e)+'<br>也可以用下面「拍照识别」或手动输入。');diag(e.name+': '+e.message);return}
  try{
    let zxErr='';loadScript(ZX_URL).catch(e=>{zxErr=e.message});            // 识别程序，同时载入
    if('BarcodeDetector' in window){
      let fmts=['ean_13','ean_8','upc_a','upc_e','code_128','itf'];
      try{const sup=await BarcodeDetector.getSupportedFormats();fmts=fmts.filter(f=>sup.includes(f))}catch{}
      if(fmts.length)det=new BarcodeDetector({formats:fmts});
    }
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const grab=crop=>{const W=v.videoWidth,H=v.videoHeight;
      if(!crop){cv.width=W;cv.height=H;cx.drawImage(v,0,0)}
      else{const cw=Math.round(W*.84),ch=Math.round(H*.44),sx=Math.round((W-cw)/2),sy=Math.round((H-ch)/2);cv.width=cw;cv.height=ch;cx.drawImage(v,sx,sy,cw,ch,0,0,cw,ch)}
      return cv};
    const tick=async()=>{
      if(stopped)return;
      if(v.videoWidth){
        frames++;let code=null;
        for(const crop of[true,false]){
          const c=grab(crop);
          if(det){try{const r=await det.detect(c);if(r[0])code=r[0].rawValue}catch{}}
          if(!code)code=zxDecode(c);
          if(code)break;
        }
        if(!code&&frames%2===0)code=zxDecodeRot(grab(false));
        if(code)feed(code);
        if(frames%5===0)diag('扫描中 '+frames+' 帧 · 画面 '+v.videoWidth+'×'+v.videoHeight+' · 系统识别:'+(det?'有':'无')+' · 识别程序:'+(window.ZXing?'已载入':zxErr?'⚠ '+zxErr:'载入中…'));
      }
      setTimeout(tick,150);
    };
    tick();
  }catch(e){diag('扫描程序出错: '+e.name+' '+e.message);msg('⚠ 自动识别没有启动。请用下面「拍照识别」或手动输入条码。')}
}

/* ---------- 搜索 ---------- */
const search=q=>{const t=q.toLowerCase().split(/\s+/).filter(Boolean),d=dig(q);
  return S.products.filter(p=>t.every(w=>p.name.toLowerCase().includes(w))||(d.length>=6&&[...(p.codes||[]),...(p.ctnCodes||[])].some(c=>c.includes(d)))).slice(0,8)};
document.addEventListener('input',e=>{
  const id_=e.target.id;
  if(id_==='sq_ctn'||id_==='sq_pcs'||id_==='sq_exp'||id_==='sq_loc'){const l=ui.recv?.lines[+e.target.dataset.i];if(l)l[{sq_ctn:'ctn',sq_pcs:'pcs',sq_exp:'exp',sq_loc:'loc'}[id_]]=e.target.value;return}
  if(e.target.dataset&&e.target.dataset.evsearch){const itId=e.target.dataset.evsearch;if(ui.ev.pick&&ui.ev.pick.id===itId){ui.ev.pick.q=e.target.value;const box=$('#evr_'+itId);if(box)box.innerHTML=evResHtml(itId,ui.ev.pick.q)}return}
  if(e.target.dataset&&e.target.dataset.dosearch){const[a,b]=e.target.dataset.dosearch.split('|'),l=ui.dox.docs[+a]?.lines[+b],box=$('#dx_'+a+'_'+b+'_r');if(l){l.q=e.target.value;if(box)box.innerHTML=doResHtml(a,b,l.q)}return}
  if(id_==='inv_q'){ui.invq=e.target.value;const box=$('#inv_list');if(box)box.innerHTML=invList();return}
  if(id_==='rv_q'){const q=e.target.value.trim(),box=$('#rv_res');if(!box)return;
    if(!q){box.innerHTML='';return}
    const ms=search(q);
    box.innerHTML=ms.map(p=>`<button class="btn sec" style="width:100%;text-align:left;margin-top:4px" data-act="rvPick" data-v="${p.id}">${esc(p.name)}</button>`).join('')||'<div class="mut">找不到</div>';
  }
  if(id_==='sq'){const box=$('#sres');if(!box)return;const q=e.target.value.trim();
    const ms=q?search(q):[];
    box.innerHTML=ms.map(p=>`<div style="margin-top:6px"><b>${esc(p.name)}</b><div class="row"><button class="btn sm" data-act="assign2" data-v="${p.id}" data-k="u">单件</button><button class="btn sm" data-act="assign2" data-v="${p.id}" data-k="c">整箱</button></div></div>`).join('')||'先输入产品名'}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='rv_q')return;
  const v=e.target.value.trim();if(dig(v).length<8)return;
  e.preventDefault();ui.rvmsg=recvHandler(v);e.target.value='';
  scanCtx.feed=x=>{ui.rvmsg=recvHandler(x);render()};scanCtx.code=v;render();
});

/* ---------- 同步更新 (多人同时用) ---------- */
const isEditing=()=>{
  if($('#scanm')||ui.recv||ui.dmg||ui.count)return true;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return true;
  return[...document.querySelectorAll('#app input[id^=rc_],#f_cust,#f_items,#f_addr')].some(i=>i.value)};
setInterval(async()=>{
  if(ui.screen!=='app'||document.hidden)return;
  if(canStock()&&(ui.tab==='pend'||ui.tab==='inv')&&!$('#scanm')){
    const a=document.activeElement;
    if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!ui.pendEdit&&!ui.editB&&!ui.dmgB){const r1=rev;try{await chain;await loadStock();if(rev===r1)render()}catch{}}
    return;
  }
  if(isEditing())return;
  const r0=rev;
  try{await chain;await loadAll();if(rev===r0&&!isEditing())render()}catch{}
},15000);

/* ---------- 共用设备: 太久没操作自动退出 ---------- */
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
const IDLE_MS=30*60*1000;
async function idleCheck(){
  if(!SHARED||!me||ui.screen!=='app'||Date.now()-lastAct<IDLE_MS)return;
  try{await chain}catch{}
  try{await sb.auth.signOut()}catch{}
  me=null;S={users:[],products:[],stops:[],loads:{},minDays:{...DEF_MIN},batches:[],moves:[],origin:{},groupIsolation:true,cleanups:[],groups:[],pending:[],alertDays:7,stockMode:false};
  ui.screen='login';ui.ok='';ui.f={};ui.msg='因为是共用设备，长时间没有操作，已自动退出。';render();
}
setInterval(idleCheck,60000);

/* ---------- 启动 ---------- */
async function boot(){
  if(!window.supabase){ui.screen='boot';ui.msg='连不上网络，请检查网络后刷新。';render();return}
  if(SHARED)clearStoredSessions();
  sb=makeClient();hookAuth();
  if(/error_code=|error=access_denied/.test(location.hash)){ui.screen='login';ui.msg='这个重设链接已经过期或用过了，请重新按「忘记密码」。';try{history.replaceState(null,'',location.pathname+location.search)}catch{}}
  else if(/type=recovery/.test(location.hash)){ui.screen='recovery';render();return}
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){await enter()}
    else{ui.screen='login';
      try{const r=await adm({action:'status'});ui.needsSetup=!!r.needsSetup}catch{}}
  }catch(e){ui.screen='login';ui.msg=e.message}
  render();
}
applyLang();
render();
boot();
</script>
