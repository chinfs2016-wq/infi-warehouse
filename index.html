<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Infinity 司机排程</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1f2a1f;--mut:#6b776b;--green:#2e7d32;--gl:#e6f4e7;--red:#c62828;--rl:#fdeaea;--org:#e65100;--ol:#fff1e0;--line:#dde3dc}
@media(prefers-color-scheme:dark){:root{--bg:#121512;--card:#1c211c;--ink:#e8efe8;--mut:#93a093;--gl:#17301a;--rl:#3a1a1a;--ol:#3a2810;--line:#2e362e;--green:#66bb6a;--red:#ef5350;--org:#ffa726}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Microsoft YaHei",sans-serif}
header{position:sticky;top:0;background:#2e7d32;color:#fff;padding:10px 16px;z-index:5}
header h1{margin:0;font-size:17px}
.who{font-size:13px;opacity:.9}
nav{display:flex;gap:6px;margin-top:8px}
nav button{flex:1;padding:8px 4px;border:0;border-radius:8px;background:rgba(255,255,255,.2);color:#fff;font-size:14px}
nav button.on{background:#fff;color:#2e7d32;font-weight:700}
main{padding:12px 16px 80px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:600}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.4}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.ok{background:var(--gl);color:var(--green)}.bad{background:var(--rl);color:var(--red)}.warn{background:var(--ol);color:var(--org)}.gray{background:var(--bg);color:var(--mut)}
h2{font-size:16px;margin:18px 0 4px}
.mut{color:var(--mut);font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:24px;height:24px;flex:none}
.item .nm{flex:1}
.done{opacity:.55}
a{color:var(--green)}
.hide{display:none}
.login{max-width:380px;margin:8vh auto 0}
.login h1{text-align:center;font-size:22px;margin:0 0 4px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.note{color:var(--green);font-size:14px;margin-top:8px}
#scanm{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--card);width:100%;max-width:720px;padding:12px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
.sbox video{width:100%;max-height:38vh;background:#000;border-radius:10px;margin:8px 0;object-fit:cover}
#sbox_v{position:relative}
.aim{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
#smsg{min-height:44px;margin:6px 0;font-size:15px}
#toast{position:fixed;left:12px;right:12px;bottom:12px;background:var(--red);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;text-align:center}
</style>
</head>

const EN_RE=new RegExp(Object.keys(EN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const CJK=/[\u4e00-\u9fff\uff00-\uffef]/;
const T=s=>{
  if(LANG!=='en'||s==null)return s;
  let r=String(s);if(!CJK.test(r))return r;
  for(const[re,to]of EN_RULES)r=r.replace(re,to);
  let lastEnd=-1,lastEn='';
  return r.replace(EN_RE,(m,off)=>{
    const e=EN[m],sp=off===lastEnd&&/[A-Za-z0-9)]$/.test(lastEn)&&/^[A-Za-z0-9(]/.test(e)?' ':'';
    lastEnd=off+m.length;lastEn=e;return sp+e;
  }).replace(/ {2,}/g,' ');
};
function trNode(n){
  if(LANG!=='en')return;
  if(n.nodeType===3){if(CJK.test(n.nodeValue)){const v=T(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}
  if(n.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName))return;
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),list=[];let x;
  while(x=w.nextNode())list.push(x);
  list.forEach(trNode);
  [n,...n.querySelectorAll('[placeholder],[title]')].forEach(el=>['placeholder','title'].forEach(a=>{
    const v=el.getAttribute&&el.getAttribute(a);if(v&&CJK.test(v)){const t=T(v);if(t!==v)el.setAttribute(a,t)}}));
}
new MutationObserver(ms=>{
  if(LANG!=='en')return;
  for(const m of ms){
    if(m.type==='childList')m.addedNodes.forEach(trNode);
    else if(m.type==='characterData')trNode(m.target);
    else{const el=m.target,v=el.getAttribute(m.attributeName);if(v&&CJK.test(v)){const t=T(v);if(t!==v)el.setAttribute(m.attributeName,t)}}
  }
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title']});

function toEmail(v){
  v=(v||'').trim().toLowerCase();
  if(v.includes('@'))return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?v:null;
  let d=v.replace(/\D/g,'');if(d.startsWith('0'))d='6'+d;

  return d+'@phone.infi-driver.app';
}

  S.stockMode=!!se.data.find(r=>r.key==='stockMode')?.data?.on;
  S.alertDays=Math.round(+se.data.find(r=>r.key==='alertDays')?.data?.days)||7;
  await loadStock();
  resetSnap();
  if(isMgr()&&typeof CATALOG!=='undefined'&&!S.products.some(p=>p.id.startsWith('ff-'))){
    S.products=S.products.filter(p=>!/^p[1-8]$/.test(p.id)).concat(CATALOG.map(c=>({...c,minDays:null})));

}
async function loadStock(){
  const[bt,sk,mv,pd]=await Promise.all([
    sb.from('batches').select('*').eq('closed',false),
    sb.rpc('stock_by_batch'),
    canStock()?sb.from('stock_moves').select('*').order('created_at',{ascending:false}).limit(120):Promise.resolve({data:[]}),
    canStock()?sb.from('stock_moves').select('*').eq('status','pending').order('created_at',{ascending:true}):Promise.resolve({data:[]})]);
  const bad=[bt,sk,mv,pd].find(r=>r.error);if(bad)throw new Error(bad.error.message);
  const sm={};sk.data.forEach(r=>sm[r.batch_id]=r.qty);
  S.batches=bt.data.map(b=>({...b,qty:sm[b.id]||0}));S.moves=mv.data;S.pending=pd.data;
  if(canStock()){ // 库存清零超过一天的批次自动收起 (还在等确认的不收)
    const wait=new Set(S.pending.map(m=>m.batch_id));
    const dead=S.batches.filter(b=>b.qty<=0&&!wait.has(b.id)&&Date.now()-new Date(b.created_at)>864e5);
    if(dead.length){await sb.from('batches').update({closed:true}).in('id',dead.map(b=>b.id));S.batches=S.batches.filter(b=>!dead.includes(b))}
  }
}

const sync=()=>chain=chain.then(syncOnce).catch(e=>toast('保存失败: '+e.message));
async function syncOnce(){
  if(!sb||!me)return;
  for(const[n,c]of Object.entries(COLS)){
    const cur=new Map(c.rows().map(r=>[r[c.pk],r]));
    const sn=snap[n];
    const ins=[];
    for(const[k,r]of cur){
      const str=JSON.stringify(r);
      if(sn.get(k)===str)continue;
      const row={...r,updated_at:new Date().toISOString()};if(n==='settings')delete row.updated_at;
      if(n!=='settings'&&!sn.has(k)){ins.push([k,str,row]);continue}
      const q=n==='settings'?sb.from(c.table).upsert(row):sb.from(c.table).update(row).eq(c.pk,k);
      const{error}=await q;if(error)throw error;
      sn.set(k,str);
    }
    for(let i=0;i<ins.length;i+=200){
      const part=ins.slice(i,i+200);
      const{error}=await sb.from(c.table).insert(part.map(x=>x[2]));if(error)throw error;
      part.forEach(x=>sn.set(x[0],x[1]));
    }
    for(const k of[...sn.keys()]){
      if(cur.has(k))continue;
      const{error}=await sb.from(c.table).delete().eq(c.pk,k);if(error)throw error;
      sn.delete(k);
    }
  }
}

const norm=x=>String(x).toLowerCase().replace(/farm fresh/g,'').replace(/\s+/g,' ').trim();
const findProduct=n=>S.products.find(p=>norm(p.name)===norm(n));
const prodById=i=>S.products.find(p=>p.id===i);
const pidOf=i=>(i.pid&&prodById(i.pid)?i.pid:findProduct(i.name)?.id)||'';
const ik=i=>pidOf(i)||key(i.name);
const parseItems=t=>t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  const m=l.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*(\S*)$/);
  const it=m?{name:m[1].trim(),qty:+m[2],unit:m[3]||''}:{name:l,qty:1,unit:''};
  it.pid=findProduct(it.name)?.id||'';return it});
const itemsText=a=>a.map(i=>`${i.name} ${i.qty} ${i.unit}`.trim()).join('\n');
function buildAgg(stops){
  const agg={};
  stops.forEach(s=>s.items.forEach(i=>{const k=ik(i);(agg[k]??={name:prodById(pidOf(i))?.name||i.name,unit:i.unit,qty:0,stops:[],pid:pidOf(i)});agg[k].qty+=toPcs(i);agg[k].stops.push(s)}));
  return agg}
const daysLeft=(exp,on)=>Math.round((new Date(exp)-new Date(on))/864e5);
const dayStops=(d,drv)=>S.stops.filter(s=>s.date===d&&(!drv||s.driver===drv)).sort((a,b)=>a.seq-b.seq);
const loadKey=(d,drv)=>d+'|'+drv;
/* 库存统一用「件」记账；箱 = 每箱几件 */
const perCtn=pid=>prodById(pid)?.perCtn||1;
const isCtnUnit=u=>!u||/^(ctn|ctns|carton|cartons|box|boxes|箱)$/i.test(String(u).trim());
const toPcs=i=>i.qty*(isCtnUnit(i.unit)?perCtn(pidOf(i)):1);
const fmtQty=(pid,pcs)=>{const c=perCtn(pid);if(c<=1)return pcs+' 件';const k=Math.floor(pcs/c),r=pcs-k*c;return(k?k+' ctn':'')+(k&&r?' + ':'')+(r||!k?r+' 件':'')};
const dig=x=>String(x||'').replace(/\D/g,'');
const codeEq=(sc,st)=>{sc=dig(sc);st=dig(st);if(!sc||!st)return false;if(sc===st)return true;
  if(sc.length===14&&st.length===13)return sc.slice(1,13)===st.slice(0,12);
  if(sc.length===13&&st.length===14)return st.slice(1,13)===sc.slice(0,12);return false};
const hasCode=(list,c)=>(list||[]).some(x=>codeEq(c,x));
const newLine=()=>({pid:'',ctn:'',pcs:'',exp:'',loc:''});
const itemExp=(L,s,j,x)=>{const al=(L.alloc||[]).filter(a=>a.stop===s.id&&a.item===j);return al.length?al.map(a=>a.exp).sort()[0]:L.batch[ik(x)]?.exp};
// 先到期先出 (FEFO)，并满足每位客人要求的最少剩余天数
function allocate(stops){
  const rem={};S.batches.forEach(b=>rem[b.id]=b.qty);
  const out=[],short=[];
  stops.forEach(s=>s.items.forEach((it,j)=>{
    const pid=pidOf(it);if(!pid)return;
    let need=toPcs(it);
    const min=prodById(pid)?.minDays??S.minDays[s.type]??1;
    const el=S.batches.filter(b=>b.product_id===pid&&!b.closed&&daysLeft(b.expiry,s.date)>=min).sort((a,b)=>a.expiry<b.expiry?-1:1);
    for(const b of el){if(need<=0)break;const t=Math.min(need,rem[b.id]);if(t<=0)continue;out.push({stop:s.id,item:j,batch:b.id,pid,pcs:t,exp:b.expiry});rem[b.id]-=t;need-=t}
    if(need>0)short.push({stop:s.id,item:j,pid,pcs:need,name:it.name,customer:s.customer,min});
  }));
  return{out,short};
}
function syncRecv(){const r=ui.recv;if(!r)return;r.po=$('#rv_po')?.value??r.po;r.date=$('#rv_date')?.value??r.date;r.loc=$('#rv_loc')?.value??r.loc;
  r.lines.forEach((l,i)=>{l.pid=$('#rl_pid_'+i)?.value??l.pid;l.ctn=$('#rl_ctn_'+i)?.value??l.ctn;l.pcs=$('#rl_pcs_'+i)?.value??l.pcs;l.exp=$('#rl_exp_'+i)?.value??l.exp;l.loc=$('#rl_loc_'+i)?.value??l.loc})}
function syncDmg(){const d=ui.dmg;if(!d)return;for(const k of['pid','bid','ctn','pcs','reason','note'])d[k]=$('#dm_'+k)?.value??d[k]}
function check(exp,stop,pid){
  if(!exp)return{st:'none'};
  const dl=daysLeft(exp,stop.date),need=prodById(pid)?.minDays??S.minDays[stop.type]??1;
  return{st:dl>=need?'ok':'bad',dl,need};
}

      else tag=`<span class="badge warn">⚠ 剩 ${dl} 天 · 部分客人不合格</span>`;
    }
    return `<div class="item" style="align-items:flex-start"><input type="checkbox" ${b.loaded?'checked':''} data-act="loaded" data-v="${k}" ${L.confirmed?'disabled':''}>
     <div class="nm"><b>${esc(a.name)}</b> × ${qtyTxt(a)} <span class="mut">已扫 ${a.pid?fmtQty(a.pid,b.scanned||0):(b.scanned||0)}/${qtyTxt(a)}</span> ${tag}
      <div class="row" style="margin-top:4px"><span class="mut">最佳食用/到期日:</span><input type="date" style="width:auto" value="${b.exp||''}" data-act="exp" data-v="${k}" ${L.confirmed?'disabled':''}></div>
      ${bad.map(r=>`<div class="mut" style="color:var(--red)">✖ ${esc(r.s.customer)} 要求至少剩 ${r.need} 天 (此批剩 ${r.dl} 天)</div>`).join('')}
     </div></div>`}).join('');
  const allOk=Object.entries(agg).every(([k,a])=>{const b=L.batch[k]||{};if(managed(a))return b.loaded;return b.exp&&b.loaded&&!a.stops.some(s=>check(b.exp,s,a.pid).st==='bad')});
  const anyBad=Object.entries(agg).some(([k,a])=>!managed(a)&&L.batch[k]?.exp&&a.stops.some(s=>check(L.batch[k].exp,s,a.pid).st==='bad'));
  const hasShort=sm&&al.short.length>0;
  const done=stops.filter(s=>s.status&&s.status!=='pending').length;
  return head+`
  <h2>① 仓库装货 ${L.confirmed?'<span class="badge ok">已确认</span>':''}</h2>
  <div class="card">
   <div class="mut">${sm?'照下面「拿哪一批」去拿货 → 扫条码 → 打勾。确认出发后，系统自动扣库存。':'逐样拿货 → 扫条码 → 看清楚日期 → 输入到期日。红色 = 寿命期不够，不要装，通知仓库换货。'}</div>
   ${L.confirmed?'':'<button class="btn" style="width:100%;margin:8px 0" data-act="scanLoad">📷 扫描装货</button>'}
   ${rows}
   ${L.confirmed?`<button class="btn sec" style="margin-top:10px" data-act="unconfirm">重新修改装货</button>`:
   `${hasShort?'<div class="badge bad" style="margin-top:10px">⚠ 有货缺 / 寿命期不够，请通知仓库或负责人</div>':''}
    <button class="btn" style="margin-top:10px;width:100%" data-act="confirmLoad" ${allOk?'':'disabled'}>✅ 全部装好，出发</button>
    ${anyBad||hasShort?'<button class="btn red" style="margin-top:8px;width:100%" data-act="alertWh">📲 通知仓库 (WhatsApp)</button>':''}`}
  </div>
  <h2>② 送货 <span class="mut">${done}/${stops.length} 站完成</span></h2>
  ${L.confirmed?stops.map((s,i)=>stopCard(s,i,L)).join(''):'<p class="mut">先完成装货确认才能开始送货。</p>'}`;
}

   <div class="row" style="margin:8px 0">

     return `<div class="item"><input type="checkbox" ${x.unloaded?'checked':''} ${fin?'disabled':''} data-act="unload" data-v="${s.id}" data-j="${j}"><div class="nm">${esc(x.name)} <b>${x.qty}${esc(x.unit)}</b> <span class="mut">扫 ${fmtQty(pid,x.scanned||0)}/${fmtQty(pid,toPcs(x))}</span> ${tag}</div></div>`}).join('')}

     <button class="btn red" data-act="fail" data-v="${s.id}">✖ 送不到</button>

}

/* ---------- 待确认 (第二人核对) ---------- */
function pendCard(m){
  const b=S.batches.find(x=>x.id===m.batch_id),p=prodById(m.product_id),mine=m.created_by===me.id,admin=me.role==='admin';
  const pc=perCtn(m.product_id),k=Math.floor(m.delta/pc),r=m.delta-k*pc;
  let h=`<div class="card"><div class="row"><b class="grow">${esc(p?.name||m.product_id)}</b><b>${fmtQty(m.product_id,m.delta)}</b></div>
   <div class="mut">到期 <b>${b?esc(b.expiry):'?'}</b>${b?.location?' · 位置 '+esc(b.location):''}${m.ref?' · '+esc(m.ref):''}</div>
   <div class="mut">录入: ${esc(m.by_name||'?')} · ${fmtTime(m.created_at)}${grpTag(m)}</div>`;
  if(ui.pendEdit===m.id)h+=`<div style="padding:10px;background:var(--bg);border-radius:8px;margin-top:8px"><b>核对后的实际数据</b>
    <div class="row"><div><label>箱 ctn</label><input id="pe_ctn" type="number" min="0" inputmode="numeric" style="width:90px" value="${k}"></div>
     <div><label>散装 件</label><input id="pe_pcs" type="number" min="0" inputmode="numeric" style="width:90px" value="${r}"></div></div>
    <div class="row"><div class="grow"><label>到期日</label><input id="pe_exp" type="date" value="${b?esc(b.expiry):''}"></div>
     <div class="grow"><label>货架位置</label><input id="pe_loc" list="locs" value="${b?esc(b.location||''):''}" autocomplete="off"></div></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="pendFix" data-v="${m.id}">确认并修正</button><button class="btn sec sm" data-act="pendCancel">取消</button></div></div>`;
  else if(mine&&!admin)h+=`<div class="mut" style="margin:6px 0">这是你自己录入的，请另一位同事来确认。</div><button class="btn sec sm" data-act="pendReject" data-v="${m.id}">撤销这笔</button>`;
  else h+=`<div class="row" style="margin-top:8px"><button class="btn grow" data-act="pendOk" data-v="${m.id}">✓ 数量正确，确认</button><button class="btn sec" data-act="pendEdit" data-v="${m.id}">✎ 不对，修改</button><button class="btn red sm" data-act="pendReject" data-v="${m.id}">✕ 退回</button></div>${mine?'<div class="mut">管理员可以直接确认自己录入的</div>':''}`;
  return h+'</div>';
}
function vPend(){
  const list=S.pending.slice().sort((a,b)=>a.created_at<b.created_at?-1:1);
  const others=list.filter(m=>m.created_by!==me.id),flt=ui.pendf||'all';
  const shown=list.filter(m=>flt==='mine'?m.created_by===me.id:flt==='others'?m.created_by!==me.id:true).filter(m=>!ui.pendg||(ui.pendg==='none'?!m.group_id:m.group_id===ui.pendg));
  const chip=(k,t,n)=>`<button class="btn ${flt===k?'':'sec'} sm" data-act="pendFilter" data-v="${k}">${t} (${n})</button>`;
  return `${locOptions()}
  <div class="mut" style="margin-bottom:8px">请第二位同事对照实物检查。<b>确认后才会计入库存。</b>录入的人不能自己确认。</div>
  <div class="row">${chip('all','全部',list.length)}${chip('others','别人录入的',others.length)}${chip('mine','我录入的',list.length-others.length)}<button class="btn sec sm" data-act="invRefresh">🔄</button></div>
  ${isMgr()&&S.groups.length?`<div class="row" style="margin-top:6px"><span class="mut">分组:</span><button class="btn ${!ui.pendg?'':'sec'} sm" data-act="pendGroup" data-v="">全部组</button>${S.groups.map(g=>`<button class="btn ${ui.pendg===g.id?'':'sec'} sm" data-act="pendGroup" data-v="${g.id}">${esc(g.name)} (${list.filter(m=>m.group_id===g.id).length})</button>`).join('')}<button class="btn ${ui.pendg==='none'?'':'sec'} sm" data-act="pendGroup" data-v="none">未分组 (${list.filter(m=>!m.group_id).length})</button></div>`:''}
  ${(me.role==='admin'?list:others).length?`<button class="btn" style="width:100%;margin-top:8px" data-act="pendAll">✓ 全部确认 (${me.role==='admin'?'':'别人录入的 '}${(me.role==='admin'?list:others).length} 笔)</button>`:''}
  ${!shown.length?'<p class="mut" style="text-align:center;margin-top:16px">没有待确认的进货 👍</p>':''}

/* ---------- 导出 Excel ---------- */
function computeAlerts(){
  const today=iso(new Date()),live=S.batches.filter(b=>b.qty>0);
  const expired=live.filter(b=>daysLeft(b.expiry,today)<0);
  const soon=live.filter(b=>{const d=daysLeft(b.expiry,today);return d>=0&&d<=S.alertDays});
  const tot={};live.forEach(b=>tot[b.product_id]=(tot[b.product_id]||0)+b.qty);
  const low=S.products.filter(p=>p.minStock>0&&(tot[p.id]||0)<p.minStock);
  return{expired,soon,low,tot,today};
}
function buildStockSheets(){
  const A=computeAlerts(),today=A.today;
  const live=S.batches.filter(b=>b.qty>0);
  const byP={};live.forEach(b=>(byP[b.product_id]??=[]).push(b));
  const split=(pid,q)=>{const c=perCtn(pid);return c>1?[Math.floor(q/c),q-Math.floor(q/c)*c]:[0,q]};
  const sum=[[tx('产品','Product'),tx('分类','Category'),tx('每箱件数','Pcs per carton'),tx('箱','Cartons'),tx('散装(件)','Loose pcs'),tx('总件数','Total pcs'),tx('最早到期','Earliest expiry'),tx('到期日数量','No. of expiry dates'),tx('货架位置','Location'),tx('状态','Status')]];
  let grand=0;
  S.products.filter(p=>byP[p.id]||A.low.includes(p)).forEach(p=>{
    const l=byP[p.id]||[],tot=l.reduce((n,b)=>n+b.qty,0),[k,r]=split(p.id,tot);grand+=tot;
    const st=[];
    if(l.some(b=>daysLeft(b.expiry,today)<0))st.push(tx('已过期','Expired'));
    else if(l.some(b=>{const d=daysLeft(b.expiry,today);return d<=S.alertDays}))st.push(tx('快到期','Expiring soon'));
    if(A.low.includes(p))st.push(tx('低库存','Low stock'));
    sum.push([p.name,p.cat||'',p.perCtn||'',k,r,tot,l.map(b=>b.expiry).sort()[0]||'',l.length,[...new Set(l.map(b=>b.location).filter(Boolean))].join(', '),st.join(' / ')]);
  });
  sum.push([]);sum.push([tx('合计','Total'),'','','','',grand,'',live.length,'','']);
  const det=[[tx('产品','Product'),tx('到期日','Expiry date'),tx('剩余天数','Days left'),tx('箱','Cartons'),tx('散装(件)','Loose pcs'),tx('总件数','Total pcs'),tx('货架位置','Location'),tx('收货日期','Received'),tx('PO / DO','PO / DO')]];
  S.products.filter(p=>byP[p.id]).forEach(p=>byP[p.id].sort((a,b)=>a.expiry<b.expiry?-1:1).forEach(b=>{
    const[k,r]=split(p.id,b.qty);det.push([p.name,b.expiry,daysLeft(b.expiry,today),k,r,b.qty,b.location||'',b.received_date,b.po_no||'']);
  }));
  return{sum,det,today};
}
function stockWorkbook(){
  const{sum,det,today}=buildStockSheets();
  const wb=XLSX.utils.book_new();
  const a=XLSX.utils.aoa_to_sheet(sum),b=XLSX.utils.aoa_to_sheet(det);
  a['!cols']=[{wch:50},{wch:10},{wch:12},{wch:9},{wch:11},{wch:11},{wch:14},{wch:14},{wch:16},{wch:22}];
  b['!cols']=[{wch:50},{wch:13},{wch:11},{wch:9},{wch:11},{wch:11},{wch:14},{wch:13},{wch:16}];
  XLSX.utils.book_append_sheet(wb,a,tx('汇总','Summary'));
  XLSX.utils.book_append_sheet(wb,b,tx('按到期日明细','By expiry date'));
  return{wb,name:'stock-'+today+'.xlsx'};
}

/* ---------- 事件 ---------- */
let rev=0;
document.addEventListener('click',onEv);
document.addEventListener('change',onEv);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest?.('[data-enter]'))document.querySelector('[data-primary]')?.click()});
const MGR_ONLY=new Set(['saveStop','cancelEdit','edit','del','dup','up','down','pick','pname','pcat','pmin','pdel','clrcodes','padd','scanBind','saveSet','copyRoute','export','rvdate','plusone','sqDone','exportXlsx','exportAudit','pendGroup','pendFilter','pendEdit','pendCancel','pendOk','pendReject','pendAll','pendFix','invFilter','invView','alertDays','pminstock','invRefresh','invEdit','invDmg','invCancel','invEditSave','invDmgSave','rvNewBatch','rvPick','rvUndo','scanChoose','noop','assign2','pper','stockmode','openP','recvOpen','rvClose','rvAdd','rvDel','rvf','rvScan','rvSave','dmgOpen','dmgClose','dmf','dmSave','countOpen','countClose','ctSave','ctScan']);
const WH_OK=new Set(['exportXlsx','exportAudit','pendFilter','pendEdit','pendCancel','pendOk','pendReject','pendAll','pendFix','invFilter','invView','pminstock','openP','rvClose','rvAdd','rvDel','rvf','rvScan','rvSave','rvdate','plusone','sqDone','rvNewBatch','rvPick','rvUndo','scanChoose','noop','assign2','invRefresh','invEdit','invDmg','invCancel','invEditSave','invDmgSave','recvOpen']);
const ADMIN_ONLY=new Set(['addGroup','delGroup','ugroup','addUser','askreset','doreset','toggleUser','delUser','urole','genpw','cancelreset','copynote','clearnote']);
async function onEv(ev){
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v,isChange=ev.type==='change';
  const chg=['date','drv','exp','loaded','unload','pname','pcat','pmin','urole','pper','stockmode','rvf','dmf','rvdate','plusone','alertDays','pminstock','ugroup'];
  if(chg.includes(a)!==isChange)return;
  if(t.tagName==='A')ev.preventDefault();
  if(ui.screen==='app'){
    if(MGR_ONLY.has(a)&&!isMgr()&&!(me.role==='warehouse'&&WH_OK.has(a)))return;
    if(ADMIN_ONLY.has(a)&&me.role!=='admin')return;
  }
  rev++;
  const L=()=>S.loads[loadKey(ui.date,ui.driver)];
  const stop=()=>S.stops.find(s=>s.id===v);
  try{
  switch(a){
   /* --- 登入相关 --- */
   case'lang':LANG=LANG==='zh'?'en':'zh';ST.set('infiLang',LANG);applyLang();break;
   case'reloadApp':location.replace(location.pathname+'?v='+Date.now()+(FULL?'&full=1':''));return;
   case'gologin':grab();ui.screen='login';ui.msg='';ui.ok='';break;
   case'goforgot':grab();ui.screen='forgot';ui.msg='';ui.ok='';break;
   case'gosetup':grab();ui.screen='setup';ui.msg='';ui.ok='';break;
   case'gochpw':ui.screen='chpw';ui.msg='';ui.ok='';break;
   case'backapp':ui.screen='app';ui.msg='';break;
   case'login':{
     grab();ui.msg='';const em=toEmail($('#a_id').value),pw=$('#a_pw').value;
     if(!em||!pw){ui.msg='请输入电话/email 和密码';break}
     const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
     if(error){ui.msg='电话/email 或密码不对';break}
     await enter();break}
   case'setup':{
     grab();ui.msg='';const name=$('#a_name').value.trim(),idn=$('#a_id').value.trim(),pw=$('#a_pw').value;
     const pe=pwOK(pw,$('#a_pw2').value);
     if(!name||!toEmail(idn)){ui.msg='请填写名字和正确的电话/email';break}
     if(pe){ui.msg=pe;break}
     await adm({action:'bootstrap',identifier:idn,name,password:pw});
     const{error}=await sb.auth.signInWithPassword({email:toEmail(idn),password:pw});
     if(error){ui.msg=error.message;ui.screen='login';break}
     ui.needsSetup=false;await enter();break}
   case'forgot':{
     grab();ui.msg='';ui.ok='';const raw=$('#a_id').value.trim(),em=toEmail(raw);
     if(!em){ui.msg='请输入正确的电话或 email';break}
     if(isPhone(raw)){ui.ok='用电话号码登入的账号，请联系管理员帮你重设密码，他会 WhatsApp 新密码给你。';break}
     const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
     if(error){ui.msg='发送失败: '+error.message;break}
     ui.ok='如果这个 email 已注册，重设链接已寄出，请到邮箱查看 (也看看垃圾邮件)。';break}
   case'newpw':{
     const pw=$('#a_pw').value,pe=pwOK(pw,$('#a_pw2').value);
     if(pe){ui.msg=pe;break}
     const{error}=await sb.auth.updateUser({password:pw});
     if(error){ui.msg=error.message;break}
     try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch{}
     if(me){ui.screen='app';toast('密码已更改 ✅')}else await enter();
     break}
   case'logout':await chain;await sb.auth.signOut();me=null;S={users:[],products:[],stops:[],loads:{},minDays:{...DEF_MIN},batches:[],moves:[],groups:[],pending:[],alertDays:7,stockMode:false};ui.screen='login';ui.msg='';ui.ok='';ui.f={};break;

   /* --- 导航 --- */
   case'tab':ui.tab=v;if(ui.tab==='inv'||ui.tab==='stock'||ui.tab==='pend'){try{await loadStock()}catch{}}break;
   case'date':ui.date=t.value||ui.date;break;
   case'drv':ui.driver=t.value;ST.set('infiDriver',t.value);break;

   /* --- 排单 --- */
   case'saveStop':{
     const o={customer:$('#f_cust').value.trim(),type:$('#f_type').value,driver:$('#f_drv').value,po:$('#f_po').value.trim(),address:$('#f_addr').value.trim(),phone:$('#f_tel').value.trim(),items:parseItems($('#f_items').value),note:$('#f_note').value.trim()};
     if(!o.customer||!o.items.length){alert('请填写客人名字和货品');return}
     if(!o.driver){alert('请先选择司机 (没有司机的话，到「用户」新增)');return}
     if(ui.edit){Object.assign(S.stops.find(s=>s.id===ui.edit),o);ui.edit=null}
     else S.stops.push({id:id(),date:ui.date,seq:dayStops(ui.date,o.driver).length+1,status:'pending',...o});
     break}
   case'cancelEdit':ui.edit=null;break;
   case'edit':ui.edit=v;break;
   case'del':if(confirm('删除这站?'))S.stops=S.stops.filter(s=>s.id!==v);break;
   case'dup':{const s=stop(),d=new Date(ui.date);d.setDate(d.getDate()+1);
     S.stops.push({...structuredClone(s),id:id(),date:iso(d),status:'pending',result:'',doneAt:'',receiver:'',items:s.items.map(i=>({...i,unloaded:false,scanned:0}))});alert('已复制到 '+iso(d));break}
   case'up':case'down':{
     const s=stop(),ls=dayStops(s.date,s.driver),i=ls.indexOf(s),j=a==='up'?i-1:i+1;
     if(ls[j]){ls.forEach((x,k)=>x.seq=k+1);[s.seq,ls[j].seq]=[ls[j].seq,s.seq]}break}
   case'copyRoute':{
     const ss=dayStops(ui.date,v);
     const txt=`🚚 *${uname(v)}* 送货路线 ${ui.date}\n\n`+ss.map((s,i)=>`*${i+1}. ${s.customer}* (${TYPES[s.type]})${s.po?'\nPO: '+s.po:''}\n📍 ${s.address}\n${s.items.map(x=>'• '+x.name+' '+x.qty+x.unit).join('\n')}${s.note?'\n📝 '+s.note:''}${s.phone?'\n📞 '+s.phone:''}`).join('\n\n');
     navigator.clipboard.writeText(T(txt)).then(()=>alert('已复制，去 WhatsApp 贴上发给司机'));return}
   case'pick':{const ta=$('#f_items'),p=prodById($('#f_pick').value);ta.value+=(ta.value&&!ta.value.endsWith('\n')?'\n':'')+p.name+' 1 ctn';return}

   /* --- 司机 --- */
   case'exp':{(L().batch[v]??={}).exp=t.value;break}
   case'loaded':{(L().batch[v]??={}).loaded=t.checked;break}
   case'confirmLoad':{
     const Lx=L();if(Lx.confirmed)break;
     if(S.stockMode){
       await loadStock();
       const stops=dayStops(ui.date,ui.driver),al=allocate(stops);
       if(al.short.length&&!confirm('⚠ 以下货库存不够或寿命期不够:\n'+al.short.map(x=>`${x.name} 缺 ${fmtQty(x.pid,x.pcs)} (${x.customer})`).join('\n')+'\n\n仍然出发?'))return;
       if(al.out.length){
         const rows=al.out.map(x=>({id:id(),batch_id:x.batch,product_id:x.pid,delta:-x.pcs,type:'load',ref:x.stop,note:ui.date+'|'+ui.driver}));
         const{error}=await sb.from('stock_moves').insert(rows);if(error)throw error;
       }
       Lx.alloc=al.out;Lx.short=al.short;
       await loadStock();
     }
     Lx.confirmed=true;break}
   case'unconfirm':{
     const Lx=L(),stops=dayStops(ui.date,ui.driver);
     if(stops.some(s=>s.status==='delivered'||s.status==='failed')){alert('已经有站点送达/失败，不能再重新修改装货');return}
     if(S.stockMode&&Lx.alloc?.length){
       const rows=Lx.alloc.map(x=>({id:id(),batch_id:x.batch,product_id:x.pid,delta:x.pcs,type:'load_undo',ref:x.stop,note:ui.date+'|'+ui.driver}));
       const{error}=await sb.from('stock_moves').insert(rows);if(error)throw error;
       Lx.alloc=[];Lx.short=[];await loadStock();
     }
     Lx.confirmed=false;break}
   case'alertWh':{
     const stops=dayStops(ui.date,ui.driver);let txt;
     if(S.stockMode){
       const al=allocate(stops);
       txt=`⚠️ 仓库缺货 (${uname(ui.driver)} ${ui.date})\n`+al.short.map(x=>`• ${x.name} 缺 ${fmtQty(x.pid,x.pcs)} — ${x.customer} 要求寿命≥${x.min} 天`).join('\n');
     }else{
       const bad=[];
       stops.forEach(s=>s.items.forEach(i=>{const b=L().batch[ik(i)];const c=check(b?.exp,s,pidOf(i));if(c.st==='bad')bad.push(`• ${i.name} — 剩 ${c.dl} 天，${s.customer} 要求≥${c.need} 天`)}));
       txt=`⚠️ 仓库注意 (${uname(ui.driver)} ${ui.date})\n以下货品寿命期不够，请换新货:\n`+[...new Set(bad)].join('\n');
     }
     navigator.clipboard.writeText(T(txt)).then(()=>alert('已复制，去 WhatsApp 贴给仓库'));return}
   case'open':ui.open=ui.open===v?null:v;break;
   case'unload':{stop().items[+t.dataset.j].unloaded=t.checked;break}
   case'deliver':{
     const s=stop();
     if(s.items.some(i=>!i.unloaded)){alert('还有货品没打勾卸货');return}
     const bad=s.items.filter((i,j)=>check(itemExp(L(),s,j,i),s,pidOf(i)).st==='bad');
     if(bad.length&&!confirm('⚠ '+bad.map(i=>i.name).join(', ')+' 寿命期低于客人要求，确定还是交给客人?'))return;
     const r=$('#rc_'+v).value.trim();
     Object.assign(s,{status:'delivered',doneAt:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),receiver:r,result:bad.length?'寿命期低于要求':''});ui.open=null;break}
   case'fail':{
     const why=prompt('送不到的原因? (客人不在 / 拒收 / 寿命期不够 …)');if(!why)return;
     const Lx=L();
     if(S.stockMode){ // 货带回仓库 → 库存加回
       const al=(Lx.alloc||[]).filter(x=>x.stop===v);
       if(al.length){
         const rows=al.map(x=>({id:id(),batch_id:x.batch,product_id:x.pid,delta:x.pcs,type:'return',ref:v,note:'送不到退回: '+why}));
         const{error}=await sb.from('stock_moves').insert(rows);if(error)throw error;
         Lx.alloc=Lx.alloc.filter(x=>x.stop!==v);await loadStock();
       }
     }
     Object.assign(stop(),{status:'failed',result:why,doneAt:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});ui.open=null;break}

   /* --- 扫描 --- */
   case'scanBind':{const p=prodById(v),ctn=t.dataset.k==='c';
     openScan('扫描'+(ctn?'整箱':'单件')+'条码 → '+p.name,c=>{
       const o=S.products.find(x=>x.codes.includes(c)||(x.ctnCodes||[]).includes(c));
       if(o&&o!==p)return `<span class="badge bad">✖ 这个条码已属于 ${esc(o.name)}</span>`;
       const lst=ctn?(p.ctnCodes??=[]):p.codes;
       if(!lst.includes(c))lst.push(c);save();return `<span class="badge ok">✔ 已记住 ${esc(c)}</span>`},()=>render());return}
   case'scanLoad':{const stops=dayStops(ui.date,ui.driver);openScan('扫描装货 (箱条码=整箱，单件条码=1件)',c=>withProduct(c,(p,ctn)=>{
       const a=buildAgg(stops)[p.id];
       if(!a)return `<span class="badge bad">✖ ${esc(p.name)} 不在今天的单，不要装！</span>`;
       const n=ctn?perCtn(p.id):1;
       const b=(L().batch[p.id]??={});b.scanned=(b.scanned||0)+n;if(b.scanned>=a.qty)b.loaded=true;render();
       return b.scanned>a.qty?`<span class="badge warn">⚠ ${esc(p.name)} 多扫了 (${fmtQty(p.id,b.scanned)}/${fmtQty(p.id,a.qty)})</span>`:
        `<span class="badge ok">✔ ${esc(p.name)} ${fmtQty(p.id,b.scanned)}/${fmtQty(p.id,a.qty)}</span>${(!S.stockMode&&!b.exp)?' <b>→ 记得输入到期日</b>':''}`}));return}
   case'scanUnload':{const s=stop();openScan('扫描卸货 · '+s.customer,c=>withProduct(c,(p,ctn)=>{
       const it=s.items.find(i=>pidOf(i)===p.id);
       if(!it)return `<span class="badge bad">✖ ${esc(p.name)} 这站没有！拿错货</span>`;
       const n=ctn?perCtn(p.id):1,need=toPcs(it);
       it.scanned=(it.scanned||0)+n;if(it.scanned>=need)it.unloaded=true;render();
       return it.scanned>need?`<span class="badge warn">⚠ ${esc(p.name)} 多扫了 (${fmtQty(p.id,it.scanned)}/${fmtQty(p.id,need)})</span>`:`<span class="badge ok">✔ ${esc(p.name)} ${fmtQty(p.id,it.scanned)}/${fmtQty(p.id,need)}</span>`}));return}
   case'assign2':{const p=prodById(v);const lst=t.dataset.k==='c'?(p.ctnCodes??=[]):p.codes;
     if(!lst.includes(scanCtx.code))lst.push(scanCtx.code);save();scanCtx.feed(scanCtx.code);return}
   case'assign':{const p=prodById($('#sassign').value);if(!p)return;const lst=v==='c'?(p.ctnCodes??=[]):p.codes;if(!lst.includes(scanCtx.code))lst.push(scanCtx.code);save();scanCtx.feed(scanCtx.code);return}

   /* --- 仓库 --- */
   case'pper':prodById(v).perCtn=t.value===''?null:Math.max(1,Math.round(+t.value));break;
   case'stockmode':S.stockMode=t.checked;break;
   case'openP':ui.openP=ui.openP===v?null:v;break;
   case'recvOpen':ui.recv={po:'',date:iso(new Date()),lines:[newLine()]};ui.dmg=null;ui.count=false;break;
   case'rvClose':ui.recv=null;break;
   case'rvAdd':syncRecv();ui.recv.lines.push(newLine());break;
   case'rvDel':syncRecv();ui.recv.lines.splice(+v,1);if(!ui.recv.lines.length)ui.recv.lines.push(newLine());break;
   case'rvf':syncRecv();return;
   case'invFilter':ui.invf=v;break;
   case'invView':ui.invView=v;break;
   case'alertDays':S.alertDays=Math.max(0,Math.round(+t.value)||7);break;
   case'pminstock':{const pr=prodById(v),u=perCtn(v)>1?perCtn(v):1;pr.minStock=t.value===''?null:Math.round(+t.value*u);break}
   case'pendFilter':ui.pendf=v;break;
   case'pendEdit':ui.pendEdit=v;break;
   case'pendCancel':ui.pendEdit=null;break;
   case'pendOk':{
     const m=S.pending.find(x=>x.id===v);if(!m)return;
     if(m.created_by===me.id&&me.role!=='admin')return;
     const{data,error}=await sb.from('stock_moves').update({status:'confirmed'}).eq('id',v).eq('status','pending').select('id');
     if(error)throw error;if(!data||!data.length)throw new Error('这一笔已经被处理了，或你没有权限确认自己录入的');
     await loadStock();toast('已确认 ✅');break}
   case'pendReject':{
     const m=S.pending.find(x=>x.id===v);if(!m)return;
     if(!confirm((m.created_by===me.id?'撤销':'退回')+'这笔进货？\n'+(prodById(m.product_id)?.name||'')+' '+fmtQty(m.product_id,m.delta)+(m.created_by===me.id?'':'\n录入的人需要重新录入。')))return;
     const{data,error}=await sb.from('stock_moves').update({status:'rejected'}).eq('id',v).eq('status','pending').select('id');
     if(error)throw error;if(!data||!data.length)throw new Error('这一笔已经被处理了');
     await loadStock();toast('已退回');break}
   case'pendAll':{
     const ids=S.pending.filter(m=>me.role==='admin'||m.created_by!==me.id).map(m=>m.id);if(!ids.length)return;
     if(!confirm('确认这 '+ids.length+' 笔进货的数量都对？\n(请先对照实物检查过)'))return;
     const{data,error}=await sb.from('stock_moves').update({status:'confirmed'}).in('id',ids).eq('status','pending').select('id');
     if(error)throw error;
     await loadStock();toast('已确认 '+(data?.length||0)+' 笔 ✅');break}
   case'pendFix':{
     const m=S.pending.find(x=>x.id===v);if(!m)return;
     const b=S.batches.find(x=>x.id===m.batch_id),pr=prodById(m.product_id);

let scanCtx={};
const prefMem={};
const getPref=()=>{let p={};try{p=JSON.parse(ST.get('infiPref')||'{}')}catch{}return{...p,...prefMem}};
function withProduct(code,fn){
  const cand=[];
  S.products.forEach(p=>{if(hasCode(p.codes,code))cand.push({p,ctn:false});if(hasCode(p.ctnCodes,code))cand.push({p,ctn:true})});
  if(cand.length===1)return fn(cand[0].p,cand[0].ctn);
  if(cand.length>1){
    const pref=getPref();
    const pc=cand.find(c=>pref[dig(code)]===c.p.id+(c.ctn?'|c':'|u'));
    if(pc)return fn(pc.p,pc.ctn);
    scanCtx.pending=fn;scanCtx.code=code;
    return `<div>这个条码对应多个产品，请选 <span class="mut">(选一次，以后自动记住)</span>：</div>`+cand.slice(0,8).map(c=>`<button class="btn sec" style="width:100%;text-align:left;margin-top:4px" data-act="scanChoose" data-v="${c.p.id}" data-k="${c.ctn?'c':'u'}">${esc(c.p.name)} ${c.ctn?'(整箱)':'(单件)'}</button>`).join('')}
  scanCtx.code=code;
  if(!canStock())return `<span class="badge warn">⚠ 这个条码还没登记 (${esc(code)})</span> 请通知负责人，或手动打勾。`;
  return `<div>新条码 <b>${esc(code)}</b>，是哪个产品？</div><div class="row"><input id="sq" class="grow" placeholder="输入产品名搜索" data-act="noop"></div><div id="sres" class="mut">先输入产品名</div>
   <div class="mut" style="margin-top:6px">找到后选「单件」或「整箱」：</div>`}
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('载入失败 '+u));setTimeout(()=>no(new Error('载入超时 '+u)),15000);document.head.appendChild(e)});
const ZX_URL='zxing.min.js'; // 放在自己的网站上，不靠外部下载
let zxMulti=null;
function zxDecode(canvas){
  if(!window.ZXing)return null;
  try{
    if(!zxMulti){
      zxMulti=new ZXing.MultiFormatReader();const h=new Map(),F=ZXing.BarcodeFormat;
      h.set(ZXing.DecodeHintType.TRY_HARDER,true);
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.ITF,F.CODE_39]);
      zxMulti.setHints(h);
    }
    const lum=new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    return zxMulti.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum))).getText();
  }catch(e){return null}
}
function zxDecodeRot(canvas){ // 条码横着/竖着拿都能读
  const r=document.createElement('canvas');r.width=canvas.height;r.height=canvas.width;
  const x=r.getContext('2d');x.translate(r.width,0);x.rotate(Math.PI/2);x.drawImage(canvas,0,0);return zxDecode(r)}
const camErr=e=>e.name==='NotAllowedError'?'⚠ 相机权限被拒绝。请到手机「设置 → 浏览器 → 网站设置/权限 → 相机」改成允许，然后刷新页面再试。':
  e.name==='NotFoundError'?'⚠ 找不到相机。':
  e.name==='NotReadableError'?'⚠ 相机正被别的程序使用，请先关掉其他用相机的 App。':
  e.name==='NoMediaDevices'?'⚠ '+e.message:'⚠ 打不开相机 ('+e.name+')。';
async function openScan(title,onCode,onClose,opts={}){
  scanCtx.hold=false;scanCtx.cool=0;
  const m=document.createElement('div');m.id='scanm';
  m.innerHTML=`<div class="sbox"><div class="row"><b class="grow">${esc(title)}</b><button class="btn sec sm" id="sx">完成</button></div>
   <div id="sbox_v"><video id="sv" playsinline muted autoplay></video><div class="aim"></div></div><div id="sdet" style="font-weight:700;min-height:20px"></div>
   ${opts.plus?`<label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:inherit;font-size:14px"><input type="checkbox" id="splus" style="width:20px;height:20px" ${ui.plusOne?'checked':''} data-act="plusone"> 每扫一次 +1 (数量很少时才用；几百箱请自己填)</label>`:''}<div id="smsg" class="mut">正在打开相机…</div>
   <div id="sdiag" class="mut" style="font-size:12px"></div>
   <label class="btn sec" style="display:block;text-align:center;margin:8px 0">📷 拍照识别 (现场扫不出来时用)<input id="sphoto" type="file" accept="image/*" capture="environment" hidden></label>
   <div class="row"><input id="smanual" class="grow" placeholder="或手动输入条码 / 扫描枪" inputmode="numeric"><button class="btn sm" id="sok">确定</button></div></div>`;
  document.body.appendChild(m);
  let stopped=false,stream,reader,det,last='',lastT=0,frames=0;
  const msg=h=>{const e=$('#smsg');if(e)e.innerHTML=h};
  const diag=t=>{const e=$('#sdiag');if(e)e.textContent=t};
  const beep=()=>{try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=1100;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},110)}catch{}};
  const feed=(c,force)=>{c=String(c).trim();if(!c)return;const n=Date.now();
    if(!force&&(scanCtx.hold||n<(scanCtx.cool||0)))return;
    if(!force&&c===last&&n-lastT<2500)return;last=c;lastT=n;
    const d=$('#sdet');if(d)d.textContent='✓ 读到条码: '+c;
    const vv=$('#sv');if(vv){vv.style.outline='4px solid #2e7d32';setTimeout(()=>{vv.style.outline=''},500)}
    beep();
    try{navigator.vibrate?.(60);scanCtx.feed=x=>feed(x,true);scanCtx.code=c;rev++;msg(onCode(c))}
    catch(e){msg('⚠ 读到条码 '+esc(c)+' 但处理时出错：'+esc(e.message||e));diag('错误: '+String(e.stack||e).slice(0,240))}};
  scanCtx.feed=x=>feed(x,true);
  const close=()=>{stopped=true;try{reader?.reset()}catch{}stream?.getTracks().forEach(t=>t.stop());m.remove();onClose?.()};
  $('#sx').onclick=close;
  $('#sok').onclick=()=>{feed($('#smanual').value,true);$('#smanual').value=''};
  $('#smanual').onkeydown=e=>{if(e.key==='Enter')$('#sok').click()};
  $('#sphoto').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;msg('识别照片中…');
    try{
      let code=null;
      if(det&&window.createImageBitmap){try{const r=await det.detect(await createImageBitmap(f));code=r[0]?.rawValue}catch{}}
      if(!code){
        if(!window.ZXing)await loadScript(ZX_URL);
        const rd=new ZXing.BrowserMultiFormatReader(),url=URL.createObjectURL(f);
        code=(await rd.decodeFromImageUrl(url)).getText();
      }
      feed(code,true);
    }catch(err){msg('⚠ 照片里认不出条码。请靠近一点、让条码占满画面、对焦清楚再拍。')}
    e.target.value='';
  };
  const v=$('#sv');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw Object.assign(new Error('这个浏览器不支持相机。请直接用 Chrome 或 Safari 打开网址 (不要在 WhatsApp / 微信里打开)。'),{name:'NoMediaDevices'});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;await v.play();
    try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch{}
    msg('相机已开。把条码放在画面中间，距离约 10–20 厘米，等它对焦。');
  }catch(e){msg(camErr(e)+'<br>也可以用下面「拍照识别」或手动输入。');diag(e.name+': '+e.message);return}
  try{
    let zxErr='';loadScript(ZX_URL).catch(e=>{zxErr=e.message});            // 识别程序，同时载入
    if('BarcodeDetector' in window){
      let fmts=['ean_13','ean_8','upc_a','upc_e','code_128','itf'];
      try{const sup=await BarcodeDetector.getSupportedFormats();fmts=fmts.filter(f=>sup.includes(f))}catch{}
      if(fmts.length)det=new BarcodeDetector({formats:fmts});
    }
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const grab=crop=>{const W=v.videoWidth,H=v.videoHeight;
      if(!crop){cv.width=W;cv.height=H;cx.drawImage(v,0,0)}
      else{const cw=Math.round(W*.84),ch=Math.round(H*.44),sx=Math.round((W-cw)/2),sy=Math.round((H-ch)/2);cv.width=cw;cv.height=ch;cx.drawImage(v,sx,sy,cw,ch,0,0,cw,ch)}
      return cv};
    const tick=async()=>{
      if(stopped)return;
      if(v.videoWidth){
        frames++;let code=null;
        for(const crop of[true,false]){
          const c=grab(crop);
          if(det){try{const r=await det.detect(c);if(r[0])code=r[0].rawValue}catch{}}
          if(!code)code=zxDecode(c);
          if(code)break;
        }
        if(!code&&frames%2===0)code=zxDecodeRot(grab(false));
        if(code)feed(code);
        if(frames%5===0)diag('扫描中 '+frames+' 帧 · 画面 '+v.videoWidth+'×'+v.videoHeight+' · 系统识别:'+(det?'有':'无')+' · 识别程序:'+(window.ZXing?'已载入':zxErr?'⚠ '+zxErr:'载入中…'));
      }
      setTimeout(tick,150);
    };
    tick();
  }catch(e){diag('扫描程序出错: '+e.name+' '+e.message);msg('⚠ 自动识别没有启动。请用下面「拍照识别」或手动输入条码。')}
}

/* ---------- 搜索 ---------- */
const search=q=>{const t=q.toLowerCase().split(/\s+/).filter(Boolean),d=dig(q);
  return S.products.filter(p=>t.every(w=>p.name.toLowerCase().includes(w))||(d.length>=6&&[...(p.codes||[]),...(p.ctnCodes||[])].some(c=>c.includes(d)))).slice(0,8)};
document.addEventListener('input',e=>{
  const id_=e.target.id;
  if(id_==='sq_ctn'||id_==='sq_pcs'||id_==='sq_exp'||id_==='sq_loc'){const l=ui.recv?.lines[+e.target.dataset.i];if(l)l[{sq_ctn:'ctn',sq_pcs:'pcs',sq_exp:'exp',sq_loc:'loc'}[id_]]=e.target.value;return}
  if(id_==='inv_q'){ui.invq=e.target.value;const box=$('#inv_list');if(box)box.innerHTML=invList();return}
  if(id_==='rv_q'){const q=e.target.value.trim(),box=$('#rv_res');if(!box)return;
    if(!q){box.innerHTML='';return}
    const ms=search(q);
    box.innerHTML=ms.map(p=>`<button class="btn sec" style="width:100%;text-align:left;margin-top:4px" data-act="rvPick" data-v="${p.id}">${esc(p.name)}</button>`).join('')||'<div class="mut">找不到</div>';
  }
  if(id_==='sq'){const box=$('#sres');if(!box)return;const q=e.target.value.trim();
    const ms=q?search(q):[];
    box.innerHTML=ms.map(p=>`<div style="margin-top:6px"><b>${esc(p.name)}</b><div class="row"><button class="btn sm" data-act="assign2" data-v="${p.id}" data-k="u">单件</button><button class="btn sm" data-act="assign2" data-v="${p.id}" data-k="c">整箱</button></div></div>`).join('')||'先输入产品名'}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='rv_q')return;
  const v=e.target.value.trim();if(dig(v).length<8)return;
  e.preventDefault();ui.rvmsg=recvHandler(v);e.target.value='';
  scanCtx.feed=x=>{ui.rvmsg=recvHandler(x);render()};scanCtx.code=v;render();
});

/* ---------- 同步更新 (多人同时用) ---------- */
const isEditing=()=>{
  if($('#scanm')||ui.recv||ui.dmg||ui.count)return true;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return true;
  return[...document.querySelectorAll('#app input[id^=rc_],#f_cust,#f_items,#f_addr')].some(i=>i.value)};
setInterval(async()=>{
  if(ui.screen!=='app'||document.hidden)return;
  if(canStock()&&(ui.tab==='pend'||ui.tab==='inv')&&!$('#scanm')){
    const a=document.activeElement;
    if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!ui.pendEdit&&!ui.editB&&!ui.dmgB){const r1=rev;try{await chain;await loadStock();if(rev===r1)render()}catch{}}
    return;
  }
  if(isEditing())return;
  const r0=rev;
  try{await chain;await loadAll();if(rev===r0&&!isEditing())render()}catch{}
},15000);

/* ---------- 启动 ---------- */
async function boot(){
  if(!window.supabase){ui.screen='boot';ui.msg='连不上网络，请检查网络后刷新。';render();return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){ui.screen='recovery';ui.msg='';render()}});
  if(/type=recovery/.test(location.hash)){ui.screen='recovery';render();return}
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){await enter()}
    else{ui.screen='login';
      try{const r=await adm({action:'status'});ui.needsSetup=!!r.needsSetup}catch{}}
  }catch(e){ui.screen='login';ui.msg=e.message}
  render();
}
applyLang();
render();
boot();
</script>
